kind = "web"
previewPath = "/"
title = "Nokia Agenda"
description = "A public, read-only calendar for the Nokia 110 4G. GitHub Pages hosts the compact interface, while the Replit server protects the private iCal feed URL and provides calendar data through a public API."
version = "1.0.0"
id = "artifacts/nokia-agenda"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20703

[services.development]
run = "pnpm --filter @workspace/nokia-agenda run dev"

[services.production]
[services.production.build]
args = [ "pnpm", "--filter", "@workspace/nokia-agenda", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "node", "artifacts/nokia-agenda/server/index.js" ]

[services.production.run.env]
PORT = "20703"
NODE_ENV = "production"

[services.production.health.startup]
path = "/healthz"
